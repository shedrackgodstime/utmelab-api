[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utmelab-pipeline"
version = "0.1.0"
description = "Autonomous multi-source question harvesting, Gate 0 validation, and multimodal AI verification for UTME Lab."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "UTME Lab Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
