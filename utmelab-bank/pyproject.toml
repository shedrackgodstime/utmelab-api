[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "utmelab-pipeline"
version = "0.1.0"
description = "Deterministic content factory for UTME Lab exam content."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "turso-serverless>=0.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/utmelab_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: hits a real network or CLI and is skipped by default",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100
