[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utmelab-bank"
version = "0.1.0"
description = "The bank's supply side: acquire, gate, describe, tag, verify, and mark questions ready for production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "libsql-client>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
utmelab-bank = "utmelab_bank.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/utmelab_bank"]

[tool.hatch.build]
artifacts = ["src/utmelab_bank/py.typed"]
force-include = { "src/utmelab_bank/py.typed" = "utmelab_bank/py.typed" }

# ---------------------------------------------------------------------------
# ruff: format and lint. Nothing in this project is exempt from formatting,
# so the formatter is the single answer to layout questions.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # shadowing a builtin
    "C4",   # comprehensions
    "DTZ",  # naive datetimes
    "T20",  # print, in library code
    "SIM",  # simplify
    "RET",  # return flow
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "RUF",  # ruff specific
    "BLE",  # blind except
    "LOG",  # logging misuse
    "G",    # logging call style
    "TID",  # tidy imports
    "PL",   # pylint subset
]
ignore = [
    "E501", # the formatter owns line length
    "TRY003", # long messages inside raise are fine here
    "PLR0913", # a task legitimately takes a run context
    "EM101", # a message beside the raise reads better than a custom class
    "EM102",
    "PLC0415", # function-level imports dodge circulars (config->store, task->rules)
    "PLR2004", # thresholds (200 chars, 400 status) read better inline than as constants
    "N818", # RowFailed/TaskError are domain names, not Exception-suffixed
    "RUF012", # pydantic models own mutable defaults safely; ClassVar breaks schema
    "PLR0912", # judge() and parse_api_question() are decision tables; splitting hides the table
    "RUF007", # zip(spans, spans[1:]) keeps py311 compat; pairwise() needs 3.10+ strict form
    "PLR0911", # fetch_one() uses guard clauses; each return is a distinct early exit
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, print and reach for magic numbers on purpose.
"tests/**" = ["T20", "PLR2004", "ARG001", "ARG002", "S101", "INP001", "PLC0415", "SIM102"]
# DDL() mirrors the API's Rust DDL constant; lowercase would break the parallel.
"src/utmelab_bank/store/schema.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["utmelab_bank"]

[tool.ruff.lint.pylint]
max-args = 13

[tool.ruff.lint.pep8-naming]
# classify() returns judge vocabulary (exact/shared_stem), not a predicate.
ignore-names = ["classify"]

# ---------------------------------------------------------------------------
# mypy: strict. The model layer and the contract layer are the ones that must
# never be sloppy, so nothing anywhere is allowed to be implicitly typed.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/utmelab_bank"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["libsql_client.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["utmelab_bank"]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers --strict-config -m 'not live' --cov=utmelab_bank --cov-fail-under=80 --cov-report=term-missing"
filterwarnings = ["error"]
markers = [
    "live: reaches the real site. Skipped by default; run with `pytest -m live`.",
]
