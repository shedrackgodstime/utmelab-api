[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "utmelab-bank"
version = "0.1.0"
description = "The UTME Lab content bank. Ingests, gates, reviews and hands over exam content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.68,<2",
  "pillow>=10,<14",
  "pydantic>=2.9,<3",
  "turso-serverless>=0.1",
]

[project.scripts]
utmelab-bank = "utmelab_bank.cli:main"

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "jsonschema>=4.23,<5",
  "types-jsonschema>=4.23,<5",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/utmelab_bank"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "utmelab_bank/config_data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: hits a real network or CLI and is skipped by default",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import order
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
]
ignore = [
  "E501",  # the line length is ruff's job, not a separate check
]

[tool.ruff.lint.per-file-ignores]
# The tests import from the package by its full path and the fixtures are
# named after what they build.
"tests/*" = ["B008"]
