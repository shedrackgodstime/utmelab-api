# Quality gate — runs on every push and pull request.

# Nothing here deploys. `deploy.yml` ships on demand (Run workflow, or a v* tag)
# and repeats the Rust gate before it builds. This workflow exists so a broken
# push is caught in minutes instead of at deploy time, which was the only other
# place anything ran.

# The repo root owns Rust and the site; `utmelab-bank/` owns the Python bank.
# Keep those as separate jobs so a Python-only change does not pay for the
# Rust toolchain and a Rust-only change does not pay for the bank suite, and
# so a bank change does not wait on a stale `Cargo.lock` or a broken site build.

name: quality

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quality.yml"
      - "Cargo.lock"
      - "utmelab-db/Cargo.toml"
      - "utmelab-server/Cargo.toml"
      - "utmelab-bank/**"
      - "site/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/quality.yml"
      - "Cargo.lock"
      - "utmelab-db/Cargo.toml"
      - "utmelab-server/Cargo.toml"
      - "utmelab-bank/**"
      - "site/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      # Includes the spec-drift test: `site/openapi.json` must match what the
      # handlers generate, so a stale committed spec fails here, not at deploy.
      - name: Tests
        run: cargo test --workspace

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Docs (warnings denied)
        run: cargo doc --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings

  site:
    name: Static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Lint
        run: npm run lint
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - name: dist carries all three tiers and the spec
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/docs/index.html
          test -f dist/dashboard/index.html
          test -f dist/openapi.json
        working-directory: site

  bank:
    name: Bank gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utmelab-bank
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: utmelab-bank/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format
        run: ruff format --check src tests

      - name: Lint
        run: ruff check src tests

      - name: Types
        run: mypy src/utmelab_bank

      - name: Tests
        run: |
          set -euo pipefail
          # The media-migration tests import `turso_serverless` and are the only
          # bank test file that depends on a server-side driver. They validate a
          # migration concern, not the bank gate, so they stay out of the gate.
          # This keeps the gate a true gate and stops a server-driver issue from
          # looking like a bank failure here.
          pytest --ignore=tests/test_media_migration.py

      # QA scratch workflow files live next to this file while they are being
      # developed, and they are not committed. Re-enable the bank-gate job below
      # only when the reusable workflow is real. Until then the standalone `bank`
      # job is the source of truth for the Python gate.
      #
      # bank-gate:
      #   name: Bank gate (reusable)
      #   uses: ./.github/workflows/bank-gate.yml
      #   with:
      #     python-version: "3.14"
      #     tests: "utmelab-bank/tests"
      #     ignore: "utmelab-bank/tests/test_media_migration.py"
      #   secrets: inherit
