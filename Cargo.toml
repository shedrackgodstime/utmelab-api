[package]
name = "utmelab-api"
version = "0.0.1"
edition = "2021"

[workspace]

[lib]
name = "utmelab_api"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "request-id", "cors", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server"] }
schemars = "1"
utoipa = { version = "6", features = ["axum_extras"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
turso = { version = "0.8", features = ["sync"] }
dotenvy = "0.15"
sha2 = "0.11.1"
constant_time_eq = "0.6.1"
argon2 = "0.6.0"
rand = "0.10.3"

[dev-dependencies]
http = "1"
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
