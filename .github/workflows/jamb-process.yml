# Full JAMB subject process (tag, explain, review, ready), split into independent jobs.
#
# Each subject owns its own runner and log. The matrix parallelism makes progress
# faster than serial dispatch. The bank's own --concurrency controls per-subject
# worker count. Keep max-parallel small to protect the database and provider quotas.

name: jamb-process

run-name: >-
  JAMB process ${{ inputs.year }} ${{ inputs.country }} [${{ inputs.command }}]

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Task or preset to run per subject"
        type: choice
        required: true
        default: "process"
        options:
          - "tag"
          - "explain"
          - "review"
          - "ready"
          - "process"
      year:
        description: "JAMB year"
        type: string
        required: true
        default: "2024"
      country:
        description: "JAMB country code"
        type: string
        required: true
        default: NG
      limit:
        description: "At most this many rows per subject"
        type: string
        required: false
        default: "200"
      concurrency:
        description: "Rows to work on at once per subject (1-8)"
        type: string
        required: false
        default: "3"
      max_failures:
        description: "Stop after this many consecutive failures (0 means no cap)"
        type: string
        required: false
        default: "3"
      provider:
        description: "Model provider for the step"
        type: choice
        required: true
        default: "config"
        options:
          - config
          - opencode
      subjects:
        description: "JSON array of subject slugs"
        type: string
        required: true
        default: >-
          ["use-of-english","chemistry","physics","commerce","geography",
           "physical-education","french","economics","principles-of-accounts",
           "islamic-religious-studies","biology","government",
           "agricultural-science","computer-studies","mathematics",
           "igbo","hausa","yoruba","arabic","literature-in-english",
           "music","home-economics","history"]

concurrency:
  group: jamb-process-${{ inputs.year }}-${{ inputs.country }}-${{ inputs.command }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    name: ${{ matrix.subject }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        subject: ${{ fromJSON(inputs.subjects) }}
    env:
      TURSO_PROD_DATABASE_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_PROD_AUTH_TOKEN_READONLY: ${{ secrets.TURSO_DB_TOKEN_READONLY }}
      TURSO_BANK_DATABASE_URL: ${{ secrets.TURSO_UTMELAB_BANK_DB_URL }}
      TURSO_BANK_AUTH_TOKEN: ${{ secrets.TURSO_UTMELAB_BANK_DB_TOKEN }}
      GROQ_API_TOKEN: ${{ secrets.GROQ_API_TOKEN }}
      GROQ_API_TOKEN_02: ${{ secrets.GROQ_API_TOKEN_02 }}
      GROQ_API_TOKEN_03: ${{ secrets.GROQ_API_TOKEN_03 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_API_KEY_01: ${{ secrets.NVIDIA_API_KEY_01 }}
      NVIDIA_API_KEY_02: ${{ secrets.NVIDIA_API_KEY_02 }}
      NVIDIA_API_KEY_03: ${{ secrets.NVIDIA_API_KEY_03 }}
      NVIDIA_API_KEY_04: ${{ secrets.NVIDIA_API_KEY_04 }}
      NVIDIA_API_KEY_05: ${{ secrets.NVIDIA_API_KEY_05 }}
      CLOUDFLARE_ACCOUNT_ID_01: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_01 }}
      CLOUDFLARE_API_TOKEN_01: ${{ secrets.CLOUDFLARE_API_TOKEN_01 }}
      CLOUDFLARE_ACCOUNT_ID_02: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_02 }}
      CLOUDFLARE_API_TOKEN_02: ${{ secrets.CLOUDFLARE_API_TOKEN_02 }}
      CLOUDFLARE_ACCOUNT_ID_03: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_03 }}
      CLOUDFLARE_API_TOKEN_03: ${{ secrets.CLOUDFLARE_API_TOKEN_03 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the bank
        working-directory: utmelab-bank
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" --no-cache-dir

      - name: Run process on subject
        working-directory: utmelab-bank
        env:
          SUBJECT: ${{ matrix.subject }}
          YEAR: ${{ inputs.year }}
          COUNTRY: ${{ inputs.country }}
          LIMIT: ${{ inputs.limit }}
          CONCURRENCY: ${{ inputs.concurrency }}
          MAX_FAILURES: ${{ inputs.max_failures }}
          PROVIDER: ${{ inputs.provider }}
          COMMAND: ${{ inputs.command }}
        run: |
          set -euo pipefail
          utmelab-bank ${{ env.COMMAND }} \
            --exam JAMB \
            --subject "$SUBJECT" \
            --year "$YEAR" \
            --country "$COUNTRY" \
            --limit "$LIMIT" \
            --concurrency "$CONCURRENCY" \
            --max-failures "$MAX_FAILURES" \
            --provider "$PROVIDER"