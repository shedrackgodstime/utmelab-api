# Enrich: tag, explain, verify and describe the rows ingest already landed.
#
# This is the model half of the split. It reads the bank database by selector
# and never receives rows from an ingest run, so the two runners are decoupled
# and each can have its own cadence. It carries the read-only production token
# (for the taxonomy that `ai-tag` needs) and the media credential, which ingest
# deliberately does not have.
#
# The acquisition half lives in `bank-ingest.yml`. Each has its own concurrency
# group so a long model run cannot block ingest.

name: bank-enrich

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "enrich runs the model tasks; media runs only the figure path; status only reports."
        type: choice
        options: [enrich, media, status]
        default: enrich
      limit:
        description: "Cap per step. Empty means the task's own batch size."
        type: string
        default: "100"
      ai:
        description: "Run the model tasks (tag, explain, verify, describe)."
        type: boolean
        default: true
      media:
        description: "Run the figure path after the model tasks."
        type: boolean
        default: true
      upload:
        description: "Publish verified figures to the media repository."
        type: boolean
        default: false

concurrency:
  group: bank-enrich
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enrich:
    name: Enrich the bank
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: utmelab-bank
    env:
      # The bank owns a dedicated, isolated database. There is deliberately no
      # fallback: a missing secret must fail the "configured" check below, not
      # silently point the bank at some other database.
      TURSO_UTMELAB_BANK_DB_URL: ${{ secrets.TURSO_UTMELAB_BANK_DB_URL }}
      TURSO_UTMELAB_BANK_DB_TOKEN: ${{ secrets.TURSO_UTMELAB_BANK_DB_TOKEN }}
      # Production is read from here and only here, with a credential that is
      # itself read-only. The bank's own store can never be production, and a
      # write is refused by the credential even if the store's read-only guard
      # were bypassed. No full-access production token is present in this job.
      TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_DB_TOKEN_READONLY: ${{ secrets.TURSO_DB_TOKEN_READONLY }}
      # The media project is a private GitLab repository; the url is not a
      # credential. The token is, and it stays in a repository secret.
      UTMELAB_BANK_MEDIA_REMOTE: ${{ secrets.UTMELAB_BANK_MEDIA_REMOTE || 'https://gitlab.com/shedrackgodstime/utmelab-bank.git' }}
      UTMELAB_BANK_MEDIA_UPLOAD_ENABLED: ${{ inputs.upload && '1' || '' }}
      UTMELAB_BANK_AI_MODEL: ${{ vars.UTMELAB_BANK_AI_MODEL || 'opencode/space-bunny-free' }}
      UTMELAB_BANK_AI_IMAGE_MODEL: ${{ vars.UTMELAB_BANK_AI_IMAGE_MODEL }}
      # When set to a different image model, a description passes only if both
      # models pass it. Unset keeps the single-witness behavior.
      UTMELAB_BANK_AI_IMAGE_SECOND_MODEL: ${{ vars.UTMELAB_BANK_AI_IMAGE_SECOND_MODEL }}
      GITLAB_FINE_GRAINED_ACCESS_TOKEN: ${{ secrets.GITLAB_FINE_GRAINED_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the bank database is configured
        run: |
          set -euo pipefail
          if [ -z "${TURSO_UTMELAB_BANK_DB_URL:-}" ]; then
            echo "::error::set the TURSO_UTMELAB_BANK_DB_URL repository secret"
            exit 1
          fi
          if [ -z "${TURSO_UTMELAB_BANK_DB_TOKEN:-}" ]; then
            echo "::error::set the TURSO_UTMELAB_BANK_DB_TOKEN repository secret"
            exit 1
          fi
          # The bank is isolated from production. Refuse to run if the two
          # names ever resolve to the same database.
          if [ -n "${TURSO_DB_URL:-}" ] && [ "${TURSO_UTMELAB_BANK_DB_URL}" = "${TURSO_DB_URL}" ]; then
            echo "::error::the bank database is the production database; refusing to run"
            exit 1
          fi

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: utmelab-bank/pyproject.toml

      - name: Install the bank
        run: pip install -e ".[dev]"

      - name: Install opencode
        if: ${{ inputs.ai && inputs.mode != 'status' }}
        run: |
          set -euo pipefail
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Restore opencode auth
        if: ${{ inputs.ai && inputs.mode != 'status' }}
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${OPENCODE_AUTH_JSON:-}" ]; then
            mkdir -p "$HOME/.local/share/opencode"
            printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
            chmod 600 "$HOME/.local/share/opencode/auth.json"
          else
            echo "no OPENCODE_AUTH_JSON secret; relying on the free model"
          fi

      - name: Configure the media credential
        if: ${{ inputs.mode != 'status' }}
        run: |
          set -euo pipefail
          # git refuses to commit without these. The runner image does not set
          # them, and the failure is a 128 on stderr that used to be swallowed.
          git config --global user.name "utmelab-bot"
          git config --global user.email "bot@utmelab.com"
          if [ -n "${GITLAB_FINE_GRAINED_ACCESS_TOKEN:-}" ]; then
            git config --global credential.helper store
            printf 'https://oauth2:%s@gitlab.com\n' "$GITLAB_FINE_GRAINED_ACCESS_TOKEN" \
              > "$HOME/.git-credentials"
            chmod 600 "$HOME/.git-credentials"
          else
            echo "no GITLAB_FINE_GRAINED_ACCESS_TOKEN secret"
          fi

      - name: Enrich
        if: ${{ inputs.mode == 'enrich' }}
        env:
          LIMIT: ${{ inputs.limit }}
          AI: ${{ inputs.ai }}
          MEDIA: ${{ inputs.media }}
        run: |
          # One row's failure is a row to retry, not a reason to abandon the
          # rest of the batch. Every step runs; the job is red at the end if any
          # of them reported a failure. `set +e` undoes the runner's `bash -e`,
          # so the `run` helper can see the status.
          set +e
          set -uo pipefail
          failures=()
          run() {
            echo "+ $*"
            "$@"
            local status=$?
            if [ "$status" -ne 0 ]; then
              failures+=("$*")
            fi
            return "$status"
          }

          limit_args=()
          [ -n "${LIMIT:-}" ] && limit_args=(--limit "$LIMIT")

          # The catalogue is the taxonomy ai-tag needs. Without the read-only
          # production credentials there is nothing to tag against, so ai-tag is
          # skipped rather than guessing.
          catalogued=0
          if [ -n "${TURSO_DB_URL:-}" ] && [ -n "${TURSO_DB_TOKEN_READONLY:-}" ]; then
            if run utmelab-bank catalog; then
              catalogued=1
            fi
          else
            echo "no production read credentials; skipping catalog"
          fi

          if [ "$AI" = "true" ]; then
            if [ "$catalogued" = "1" ]; then
              run utmelab-bank task ai-tag --where "no subtopic" "${limit_args[@]}"
            else
              echo "no catalogue; skipping ai-tag"
            fi
            run utmelab-bank task ai-explain --where "no explanation" "${limit_args[@]}"
            run utmelab-bank task ai-verify --where "unverified" "${limit_args[@]}"
          fi

          if [ "$MEDIA" = "true" ] && [ "$AI" = "true" ]; then
            if [ -z "${UTMELAB_BANK_MEDIA_REMOTE:-}" ]; then
              echo "::error::set the UTMELAB_BANK_MEDIA_REMOTE repository secret"
              failures+=("media: no remote")
            else
              run utmelab-bank goal media "${limit_args[@]}"
            fi
          elif [ "$MEDIA" = "true" ]; then
            echo "media requested without ai; describing a figure needs a model"
          fi

          if [ "${#failures[@]}" -ne 0 ]; then
            echo "::error::${#failures[@]} step(s) failed: ${failures[*]}"
            exit 1
          fi

      - name: Media
        if: ${{ inputs.mode == 'media' && inputs.ai }}
        env:
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if [ -z "${UTMELAB_BANK_MEDIA_REMOTE:-}" ]; then
            echo "::error::set the UTMELAB_BANK_MEDIA_REMOTE repository secret"
            exit 1
          fi
          limit_args=()
          [ -n "${LIMIT:-}" ] && limit_args=(--limit "$LIMIT")
          utmelab-bank goal media "${limit_args[@]}"

      - name: Status
        if: ${{ always() }}
        run: |
          set -uo pipefail
          utmelab-bank status --json > status.json || true
          {
            echo "### Bank status"
            echo
            echo '```json'
            cat status.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bank-enrich-status
          path: utmelab-bank/status.json
          if-no-files-found: ignore
