name: Auto-verify WAEC Questions

on:
  workflow_dispatch:
    inputs:
      subject:
        description: 'Subject to verify'
        required: true
        type: choice
        options:
          - economics
          - physics
          - chemistry
          - biology
          - agriculture
          - computer-studies
          - data-processing
      limit:
        description: 'Max questions to verify'
        required: false
        default: '20'
        type: string
      model:
        description: 'LLM model to use'
        required: false
        default: 'anthropic/claude-sonnet-4-20250514'
        type: choice
        options:
          - anthropic/claude-sonnet-4-20250514
          - anthropic/claude-3-5-sonnet-20241022
          - openai/gpt-4o
          - openai/gpt-4o-mini
      dry_run:
        description: 'Dry run (do not save verifications)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  auto-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install httpx

      - name: Run auto-verification
        run: |
          python3 tools/auto_verify.py \
            --subject ${{ github.event.inputs.subject }} \
            --exam WAEC \
            --limit ${{ github.event.inputs.limit }} \
            --model ${{ github.event.inputs.model }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}