# Audit rejected items across the bank
#
# Generates a CSV/JSON report of all rejected items with categorized reasons.
# Run manually when needed.

name: audit-rejected

on:
  workflow_dispatch:
    inputs:
      exam:
        description: "Exam filter (e.g., JAMB)"
        type: string
        required: false
        default: "JAMB"
      subject:
        description: "Subject filter (optional)"
        type: string
        required: false
        default: ""
      year:
        description: "Year filter (optional)"
        type: string
        required: false
        default: ""
      format:
        description: "Output format"
        type: choice
        required: true
        default: "csv"
        options:
          - csv
          - json

concurrency:
  group: audit-rejected
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  audit:
    name: Audit rejected
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TURSO_BANK_DATABASE_URL: ${{ secrets.TURSO_UTMELAB_BANK_DB_URL }}
      TURSO_BANK_AUTH_TOKEN: ${{ secrets.TURSO_UTMELAB_BANK_DB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install the bank
        working-directory: utmelab-bank
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"

      - name: Run audit
        working-directory: utmelab-bank
        env:
          EXAM: ${{ inputs.exam }}
          SUBJECT: ${{ inputs.subject }}
          YEAR: ${{ inputs.year }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$EXAM" ]; then args+=(--exam "$EXAM"); fi
          if [ -n "$SUBJECT" ]; then args+=(--subject "$SUBJECT"); fi
          if [ -n "$YEAR" ]; then args+=(--year "$YEAR"); fi
          args+=(--format "${{ inputs.format }}" --summary)

          if [ "${{ inputs.format }}" = "csv" ]; then
            python scripts/audit_rejected.py "${args[@]}" --output rejected_audit.csv
          else
            python scripts/audit_rejected.py "${args[@]}" --output rejected_audit.json
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: rejected-audit-${{ inputs.format }}
          path: |
            utmelab-bank/rejected_audit.csv
            utmelab-bank/rejected_audit.json
          retention-days: 30