# Ingest: fetch from the source and land valid rows in the bank.
#
# This is the acquisition half of the split. It runs `fill` (the plan in
# `scrape_targets`), then `intake`, `gate` and `dedupe`. It never calls a model
# and never touches the media repository. It reads the read-only production
# hashes so `dedupe` can refuse a question production already serves.
#
# The enrich half lives in `bank-enrich.yml`. Each has its own concurrency group
# so a long model run cannot block ingest.

name: bank-ingest

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source plugin name."
        type: string
        default: myschool
      exam:
        description: "jamb, waec or neco."
        type: string
        default: jamb
      subject:
        description: "Catalog subject slugs. Empty means every mapped subject."
        type: string
        default: ""
      from_year:
        description: "Oldest year in the window. Empty means ten years back."
        type: string
        default: ""
      to_year:
        description: "Newest year in the window. Empty means the exam's default."
        type: string
        default: ""
      minutes:
        description: "Stop the fill after this many minutes."
        type: string
        default: "50"
      max_targets:
        description: "Stop the fill after this many targets. Empty means no cap."
        type: string
        default: ""
      delay:
        description: "Seconds between requests. Empty uses the source default."
        type: string
        default: ""
      refresh:
        description: "Re-queue drained and empty targets before filling."
        type: boolean
        default: false
      limit:
        description: "Cap per intake/gate/dedupe step. Empty means the task's batch."
        type: string
        default: "200"

concurrency:
  group: bank-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    name: Fill and gate the bank
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: utmelab-bank
    env:
      # The bank owns a dedicated, isolated database. There is deliberately no
      # fallback: a missing secret must fail the "configured" check below, not
      # silently point the bank at some other database.
      TURSO_UTMELAB_BANK_DB_URL: ${{ secrets.TURSO_UTMELAB_BANK_DB_URL }}
      TURSO_UTMELAB_BANK_DB_TOKEN: ${{ secrets.TURSO_UTMELAB_BANK_DB_TOKEN }}
      # Dedupe reads production content hashes, read-only, so a question the
      # API already serves is refused at acquisition time. The credential is
      # read-only; the bank store is never handed the production url.
      TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
      TURSO_DB_TOKEN_READONLY: ${{ secrets.TURSO_DB_TOKEN_READONLY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the bank database is configured
        run: |
          set -euo pipefail
          if [ -z "${TURSO_UTMELAB_BANK_DB_URL:-}" ]; then
            echo "::error::set the TURSO_UTMELAB_BANK_DB_URL repository secret"
            exit 1
          fi
          if [ -z "${TURSO_UTMELAB_BANK_DB_TOKEN:-}" ]; then
            echo "::error::set the TURSO_UTMELAB_BANK_DB_TOKEN repository secret"
            exit 1
          fi
          if [ -n "${TURSO_DB_URL:-}" ] && [ "${TURSO_UTMELAB_BANK_DB_URL}" = "${TURSO_DB_URL}" ]; then
            echo "::error::the bank database is the production database; refusing to run"
            exit 1
          fi
          if [ -z "${TURSO_DB_URL:-}" ] || [ -z "${TURSO_DB_TOKEN_READONLY:-}" ]; then
            echo "::error::set TURSO_DB_URL and TURSO_DB_TOKEN_READONLY; dedupe reads production hashes"
            exit 1
          fi

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: utmelab-bank/pyproject.toml

      - name: Install the bank
        run: pip install -e ".[dev]"

      - name: Ingest
        env:
          SOURCE: ${{ inputs.source }}
          EXAM: ${{ inputs.exam }}
          SUBJECT: ${{ inputs.subject }}
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
          MINUTES: ${{ inputs.minutes }}
          MAX_TARGETS: ${{ inputs.max_targets }}
          DELAY: ${{ inputs.delay }}
          REFRESH: ${{ inputs.refresh }}
          LIMIT: ${{ inputs.limit }}
        run: |
          # One target's failure is a retry, not a reason to abandon the rest of
          # the run. Every step runs; the job is red at the end if any reported a
          # failure. `set +e` undoes the runner's `bash -e`, so the `run` helper
          # can see the status.
          set +e
          set -uo pipefail
          failures=()
          run() {
            echo "+ $*"
            "$@"
            local status=$?
            if [ "$status" -ne 0 ]; then
              failures+=("$*")
            fi
            return "$status"
          }

          subject_args=()
          for name in $(printf '%s' "${SUBJECT:-}" | tr ',' ' '); do
            [ -n "$name" ] && subject_args+=(--subject "$name")
          done

          fill_args=(--source "$SOURCE" --exam "$EXAM" --minutes "$MINUTES")
          [ -n "${FROM_YEAR:-}" ] && fill_args+=(--from-year "$FROM_YEAR")
          [ -n "${TO_YEAR:-}" ] && fill_args+=(--to-year "$TO_YEAR")
          [ -n "${MAX_TARGETS:-}" ] && fill_args+=(--max-targets "$MAX_TARGETS")
          [ -n "${DELAY:-}" ] && fill_args+=(--delay "$DELAY")
          [ "${REFRESH:-false}" = "true" ] && fill_args+=(--refresh)

          limit_args=()
          [ -n "${LIMIT:-}" ] && limit_args=(--limit "$LIMIT")

          run utmelab-bank fill "${fill_args[@]}" "${subject_args[@]}"
          run utmelab-bank task intake "${limit_args[@]}"
          run utmelab-bank task gate "${limit_args[@]}"
          run utmelab-bank task dedupe "${limit_args[@]}"

          if [ "${#failures[@]}" -ne 0 ]; then
            echo "::error::${#failures[@]} step(s) failed: ${failures[*]}"
            exit 1
          fi

      - name: Status
        if: ${{ always() }}
        run: |
          set -uo pipefail
          utmelab-bank status --json > status.json || true
          {
            echo "### Bank status"
            echo
            echo '```json'
            cat status.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bank-ingest-status
          path: utmelab-bank/status.json
          if-no-files-found: ignore
