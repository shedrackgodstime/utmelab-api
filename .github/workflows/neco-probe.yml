name: NECO Year Probe

on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "Comma-separated subjects to probe"
        type: string
        required: true
        default: "english-language,physics,chemistry,mathematics,economics"
      years:
        description: "Comma-separated years to probe (2000-2025)"
        type: string
        required: true
        default: "2000,2001,2002,2003,2004,2005,2010,2015,2020,2024,2025"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bank
        working-directory: utmelab-bank
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Probe NECO years
        working-directory: utmelab-bank
        env:
          SUBJECTS: ${{ inputs.subjects }}
          YEARS: ${{ inputs.years }}
        run: |
          set -euo pipefail
          IFS=',' read -ra SUBJECTS <<< "$SUBJECTS"
          IFS=',' read -ra YEARS <<< "$YEARS"
          
          echo "subject,year,has_data,item_count,pages" > neco_probe_results.csv
          
          for subj in "${SUBJECTS[@]}"; do
            for yr in "${YEARS[@]}"; do
              echo "Probing NECO/$subj/$yr..."
              result=$(PYTHONPATH=src python -c "
import asyncio, httpx, json, sys
async def main():
    async with httpx.AsyncClient(timeout=20) as client:
        try:
            resp = await client.get(f'https://myschool.ng/api/web/v1/classroom/$subj?exam_type=neco&exam_year=$yr')
            if resp.status_code == 200:
                data = resp.json()
                rows = data.get('data', {}).get('practice_questions', {}).get('data', [])
                if rows:
                    pages = data.get('data', {}).get('practice_questions', {}).get('last_page', 1)
                    print(f'HAS_DATA,{len(rows)},{pages}')
                else:
                    print('NO_DATA,0,0')
            else:
                print(f'HTTP_{resp.status_code},0,0')
        except Exception as e:
            print(f'ERROR,{e},0,0')
asyncio.run(main())
" 2>/dev/null)
              echo "$subj,$yr,$result" >> neco_probe_results.csv
              sleep 1  # Be nice to the API
            done
          done
          
          echo "=== Results ==="
          cat neco_probe_results.csv
          
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: neco-probe-results
          path: utmelab-bank/neco_probe_results.csv
