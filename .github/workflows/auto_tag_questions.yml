name: Auto-tag Questions Prototype

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject to process (e.g., mathematics, physics, use-of-english)"
        required: false
        default: "mathematics"
        type: string
      data_dir:
        description: "Data directory (use data/waec for the WAEC bank)"
        required: false
        default: "data"
        type: string
      exam:
        description: "Exam code"
        required: false
        default: "JAMB"
        type: string
      limit:
        description: "Number of questions to process"
        required: false
        default: "10"
        type: string
      engine:
        description: "Execution engine"
        required: false
        default: "opencode"
        type: choice
        options:
          - opencode
          - mock
      model:
        description: "Override model id (blank = engine default; opencode=opencode/space-bunny-free)"
        required: false
        default: ""
        type: string
      include_verified:
        description: "Include already-verified questions (widen the pool)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install opencode CLI
        if: ${{ github.event.inputs.engine == 'opencode' }}
        run: npm install -g opencode-ai@1.19.0

      - name: Install Python deps
        run: pip install pydantic

      - name: Run auto-tagging
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GITHUB_TOKEN: "true"
          SHARE: "false"
        run: |
          ARGS=(--subject "${{ github.event.inputs.subject }}"
                --data-dir "${{ github.event.inputs.data_dir }}"
                --exam "${{ github.event.inputs.exam }}"
                --limit "${{ github.event.inputs.limit }}"
                --engine "${{ github.event.inputs.engine }}"
                --output tagging_results.json)
          if [ -n "${{ github.event.inputs.model }}" ]; then
            ARGS+=(--model "${{ github.event.inputs.model }}")
          fi
          if [ "${{ github.event.inputs.include_verified }}" = "true" ]; then
            ARGS+=(--all)
          fi
          python3 tools/auto_tag_questions.py "${ARGS[@]}"

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-tag-results-${{ github.event.inputs.subject }}-${{ github.run_number }}
          path: tagging_results.json
          if-no-files-found: error
          retention-days: 7

      - name: Print summary
        if: always()
        run: |
          if [ -f tagging_results.json ]; then
            python3 - <<'PY'
          import json
          data = json.load(open("tagging_results.json"))
          meta, summary = data["metadata"], data["summary"]
          print("=== TAGGING SUMMARY ===")
          print(f"Exam: {meta['exam']}  Subject: {meta['subject'] or 'all'}  Engine: {meta.get('engine','?')}  Model: {meta['model']}")
          print(f"Processed: {meta['processed']}  Duration: {summary['duration_seconds']}s")
          print(f"Success: {summary['success']}/{summary['total']}  Failed: {summary['failed']}")
          print(f"Subtopics assigned: {summary['subtopics_assigned']}")
          print(f"Underlines found: {summary['underlines_found']}")
          print(f"Answers verified: {summary['answers_verified']}")
          print("\nSample results:")
          for r in data["results"][:5]:
              if r["error"]:
                  print(f"  {r['question_id']}: ERROR - {r['error']}")
              else:
                  print(f"  {r['question_id']}: subtopic={r['assigned_subtopic']}, underline={r['underline_word']}, answer_ok={r['answer_verified']}, quality={r['explanation_quality']}, conf={r['confidence']:.2f}")
          PY
          fi
