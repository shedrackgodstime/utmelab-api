# Harvests exam questions and verifies the bank.
#
# Why the crawl runs here: it is a multi-hour job on a bad phone network. Not
# because CI is where crawls belong — politeness is a property of
# utmelab-bank (single worker, 2s spacing, an identified user agent)
# and holds wherever it runs.
#
# What this workflow deliberately does NOT do: run in parallel. The matrix
# below fans out across *verify* (cheap, isolated) but the harvest is a single
# sequential job with a concurrency group, because two crawlers at once doubles
# the request rate on somebody else's server.
#
# No secrets are used. The harvest reads public pages and writes JSON back to
# the repository using the automatic GITHUB_TOKEN.

name: harvest

on:
  workflow_dispatch:
    inputs:
      subjects:
        description: "Comma-separated subject slugs, or 'all'"
        required: false
        default: all
      year:
        description: Exam year
        required: false
        default: "2025"
      delay:
        description: Seconds between requests (politeness floor)
        required: false
        default: "2"
      probe:
        description: "Count only, fetch no question pages"
        type: boolean
        default: false
  schedule:
    # 06:17 UTC daily. Off the hour on purpose: every workflow in the world
    # fires at :00, and shared infrastructure notices.
    - cron: "17 6 * * *"

concurrency:
  group: harvest
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  harvest:
    name: Harvest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install utmelab-bank
        working-directory: utmelab-bank
        run: |
          python -m pip install --upgrade pip
          pip install --break-system-packages -e ".[dev]"

      - name: Run harvest (utmelab-bank scrape)
        working-directory: utmelab-bank
        env:
          SUBJECTS: ${{ inputs.subjects != 'all' && inputs.subjects || '' }}
        run: |
          set -euo pipefail
          YEAR="${{ inputs.year }}"
          if [ "${{ inputs.probe }}" = "true" ]; then
            for subj in ${SUBJECTS:-}; do
              echo "Probing $subj..."
              utmelab-bank scrape --source myschool --exam neco --subject "$subj" --year "$YEAR" --dry-run --log-level INFO
            done
          else
            for subj in ${SUBJECTS:-}; do
              echo "Scraping $subj..."
              utmelab-bank scrape --source myschool --exam neco --subject "$subj" --year "${{ inputs.year }}" --delay "${{ inputs.delay }}" --log-level INFO
            done
          fi
        timeout-minutes: 360

      - name: Upload harvest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-log
          path: utmelab-bank/var/logs
          retention-days: 7

  verify:
    name: Verify (${{ matrix.subject }})
    needs: harvest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        subject: [api, data]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.subject == 'api'
        run: cargo fmt --check

      - name: Clippy
        if: matrix.subject == 'api'
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        if: matrix.subject == 'api'
        run: cargo test --workspace

      - name: The bank must load and merge cleanly
        if: matrix.subject == 'data'
        run: |
          cargo run --quiet -- import --dry-run
          python3 tools/harvest_all.py --probe --subjects government --pages 2 --delay 1
