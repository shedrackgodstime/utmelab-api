name: UTME Lab Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Pipeline action to execute"
        required: true
        default: "process"
        type: choice
        options:
          - "process"
          - "promote"
          - "metrics"
          - "status"
          - "sync-to-prod"
      subject:
        description: "Subject slug (e.g. physics, mathematics, chemistry)"
        required: false
        default: "physics"
        type: string
      exam:
        description: "Exam code"
        required: true
        default: "JAMB"
        type: choice
        options:
          - "JAMB"
          - "WAEC"
          - "NECO"
      source:
        description: "Harvester source (for harvest action)"
        required: false
        default: "jamb"
        type: string
      year:
        description: "Cohort year"
        required: false
        default: "2025"
        type: string
      limit:
        description: "Batch limit"
        required: false
        default: "50"
        type: string
      concurrency:
        description: "AI Worker concurrency"
        required: false
        default: "4"
        type: string
      auto_promote:
        description: "Auto-promote high-confidence verified rows to Pipeline DB"
        required: false
        default: false
        type: boolean
      confirm_prod_sync:
        description: "Explicitly confirm live write for sync-to-prod (SAFETY)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pipeline-job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCode CLI
        if: ${{ github.event.inputs.action == 'process' }}
        run: |
          npm install -g opencode-ai@1.19.0 || (curl -fsSL https://opencode.ai/install.sh | bash && echo "$HOME/.opencode/bin" >> $GITHUB_PATH)

      - name: Install Pipeline Package
        run: |
          python -m pip install --upgrade pip uv
          uv pip install -e "utmelab-pipeline/[dev]" --system

      - name: Run Test Suite
        run: |
          cd utmelab-pipeline && pytest -v

      - name: Execute Pipeline Action
        env:
          TURSO_PIPELINE_DB_URL: ${{ secrets.TURSO_PIPELINE_DB_URL }}
          TURSO_PIPELINE_DB_TOKEN: ${{ secrets.TURSO_PIPELINE_DB_TOKEN }}
          TURSO_PROD_DB_URL: ${{ secrets.TURSO_PROD_DB_URL }}
          TURSO_PROD_DB_TOKEN: ${{ secrets.TURSO_PROD_DB_TOKEN }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          
          if [ "$ACTION" = "process" ]; then
            PROMOTE_FLAG=""
            if [ "${{ github.event.inputs.auto_promote }}" = "true" ]; then
              PROMOTE_FLAG="--auto-promote"
            fi
            pipeline process \
              --subject "${{ github.event.inputs.subject }}" \
              --exam "${{ github.event.inputs.exam }}" \
              --limit "${{ github.event.inputs.limit }}" \
              --concurrency "${{ github.event.inputs.concurrency }}" \
              $PROMOTE_FLAG
          elif [ "$ACTION" = "promote" ]; then
            SUBJ_ARG=""
            if [ -n "${{ github.event.inputs.subject }}" ]; then
              SUBJ_ARG="--subject ${{ github.event.inputs.subject }}"
            fi
            pipeline promote $SUBJ_ARG --limit "${{ github.event.inputs.limit }}"
          elif [ "$ACTION" = "metrics" ]; then
            pipeline metrics --summary-file "$GITHUB_STEP_SUMMARY"
          elif [ "$ACTION" = "status" ]; then
            pipeline status
          elif [ "$ACTION" = "sync-to-prod" ]; then
            CONFIRM_FLAG=""
            if [ "${{ github.event.inputs.confirm_prod_sync }}" = "true" ]; then
              CONFIRM_FLAG="--confirm"
            fi
            SUBJ_ARG=""
            if [ -n "${{ github.event.inputs.subject }}" ]; then
              SUBJ_ARG="--subject ${{ github.event.inputs.subject }}"
            fi
            pipeline sync-to-prod $SUBJ_ARG --exam "${{ github.event.inputs.exam }}" $CONFIRM_FLAG
          fi

      - name: Generate Pipeline Observability Telemetry
        if: always()
        env:
          TURSO_PIPELINE_DB_URL: ${{ secrets.TURSO_PIPELINE_DB_URL }}
          TURSO_PIPELINE_DB_TOKEN: ${{ secrets.TURSO_PIPELINE_DB_TOKEN }}
          TURSO_PROD_DB_URL: ${{ secrets.TURSO_PROD_DB_URL }}
          TURSO_PROD_DB_TOKEN: ${{ secrets.TURSO_PROD_DB_TOKEN }}
        run: |
          if [ -n "$TURSO_PIPELINE_DB_URL" ]; then
            pipeline metrics --summary-file "$GITHUB_STEP_SUMMARY" || true
          fi
