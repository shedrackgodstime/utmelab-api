name: scrape-temp
on:
  workflow_dispatch:

jobs:
  listings:
    strategy:
      fail-fast: false
      matrix:
        cat: [marketing, office-practice, book-keeping]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape/fetch.py listings ${{ matrix.cat }}
      - uses: actions/upload-artifact@v4
        with:
          name: listings-${{ matrix.cat }}
          path: out/

  details:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cat: catering-craft, skip: 0 }
          - { cat: general-mathematics, skip: 61 }
          - { cat: chemistry, skip: 60 }
          - { cat: economics, skip: 59 }
          - { cat: islamic-studies, skip: 71 }
          - { cat: biology, skip: 78 }
          - { cat: physics, skip: 59 }
          - { cat: christian-religious-studies, skip: 77 }
          - { cat: agriculture, skip: 77 }
          - { cat: commerce, skip: 83 }
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape/fetch.py details ${{ matrix.cat }} ${{ matrix.skip }}
      - uses: actions/upload-artifact@v4
        with:
          name: details-${{ matrix.cat }}
          path: out/
