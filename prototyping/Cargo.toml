[package]
name = "prototyping"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "limit", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libsql = { version = "0.10.0", features = ["replication"] }
dotenvy = "0.15.7"
turso = { version = "0.8.3", features = ["sync"] }
